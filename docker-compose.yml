services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: gs26
      POSTGRES_PASSWORD: gs26_dev_password
      POSTGRES_DB: gs26
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
  # Local S3-compatible storage for uploads (avatars, covers, documents).
  # After `docker compose up -d`, run `pnpm storage:init` once. Keys must match
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env. Development only.
  s3:
    image: rustfs/rustfs:1.0.0
    ports:
      - '9000:9000'
    environment:
      RUSTFS_ACCESS_KEY: picdev
      RUSTFS_SECRET_KEY: picdev-local-secret
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  s3data:
